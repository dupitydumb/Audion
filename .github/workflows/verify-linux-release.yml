name: Verify Linux Release

# Smoke-tests the released AppImage on several distros under Xvfb.
# "Pass" means ALL of these are true:
#   1. the downloaded asset is a real AppImage whose AppRun is the patched wrapper
#   2. the app process starts (launched from an unrelated cwd on purpose)
#   3. a visible window appears
#   4. the screen shows real content (not a black/blank window)
#   5. the process is still alive STABLE_SECS later and still not blank

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to verify (e.g. v1.2.3)'
        required: true
        type: string
      version:
        description: 'Version string used in the asset filename (e.g. 1.2.3)'
        required: true
        type: string
    outputs:
      result:
        description: 'success or failure'
        value: ${{ jobs.smoke-test-linux.result }}
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to verify (e.g. v1.2.3)'
        required: true
        type: string
      version:
        description: 'Version string used in the asset filename (e.g. 1.2.3). Leave blank to strip the leading v from tag_name.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version from input or tag
        id: resolve
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag_name }}
        run: |
          VER="$IN_VERSION"
          if [ -z "$VER" ]; then
            VER="${IN_TAG#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  smoke-test-linux:
    runs-on: ubuntu-22.04
    needs: resolve-version
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            pkg_manager: apt
          - name: ubuntu-24.04
            image: ubuntu:24.04
            pkg_manager: apt
          - name: debian-12
            image: debian:12
            pkg_manager: apt
          - name: kali-rolling
            image: kalilinux/kali-rolling
            pkg_manager: apt
          - name: fedora-latest
            image: fedora:latest
            pkg_manager: dnf
          - name: archlinux
            image: archlinux:latest
            pkg_manager: pacman
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed
            pkg_manager: zypper
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Install test tooling + runtime deps
        run: |
          set -e
          # Test tooling on every distro: Xvfb, dbus session, pgrep, window query, screenshot.
          case "${{ matrix.pkg_manager }}" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                curl ca-certificates xvfb xauth dbus dbus-x11 procps xdotool imagemagick libgl1 libegl1 \
                libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
              for pkg in libgl1-mesa-dri libasound2 libasound2t64; do
                apt-get install -y --no-install-recommends "$pkg" 2>/dev/null || true
              done
              ;;
            dnf)
              # curl-minimal is already in the fedora image; do not install "curl".
              dnf install -y \
                xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-x11 procps-ng \
                xdotool ImageMagick \
                webkit2gtk4.1 gtk3 libappindicator-gtk3 \
                alsa-lib mesa-dri-drivers mesa-libEGL
              ;;
            pacman)
              pacman -Syu --noconfirm \
                curl xorg-server-xvfb xorg-xauth dbus procps-ng xdotool imagemagick \
                webkit2gtk-4.1 gtk3 libayatana-appindicator \
                alsa-lib mesa
              ;;
            zypper)
              zypper --non-interactive --gpg-auto-import-keys refresh || true
              zypper --non-interactive install \
                curl xorg-x11-server-Xvfb xvfb-run xauth dbus-1 dbus-1-x11 procps xdotool ImageMagick \
                libwebkit2gtk-4_1-0 libgtk-3-0 \
                alsa Mesa-dri Mesa-libEGL1 Mesa-libGL1
              for pkg in libayatana-appindicator3-1 typelib-1_0-AyatanaAppIndicator3-0_1; do
                zypper --non-interactive install "$pkg" 2>/dev/null || true
              done
              ;;
          esac

      - name: Download AppImage from release
        env:
          VER: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/audion_${VER}_x86_64.AppImage"
          echo "Downloading $URL"
          # -f: fail on HTTP 404 instead of saving an HTML error page as the "AppImage"
          curl -fSL --retry 3 --retry-delay 5 -o audion.AppImage "$URL"
          chmod +x audion.AppImage
          ls -lh audion.AppImage

          if [ "$(head -c 4 audion.AppImage | tail -c 3)" != "ELF" ]; then
            echo "::error::Downloaded file is not an ELF/AppImage"
            exit 1
          fi

      - name: Verify native package installation (DEB or RPM)
        env:
          VER: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -e
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          case "${{ matrix.pkg_manager }}" in
            apt)
              DEB_URL="${BASE}/audion_${VER}_linux.deb"
              if curl -sILf "$DEB_URL" >/dev/null 2>&1; then
                echo "Downloading and testing native DEB installation..."
                curl -fSL --retry 3 -o pkg.deb "$DEB_URL"
                apt-get install -y --no-install-recommends ./pkg.deb
                which audion || test -f /usr/bin/audion
                echo "DEB installed successfully on ${{ matrix.name }}"
                rm -f pkg.deb
              fi
              ;;
            dnf)
              RPM_URL="${BASE}/audion_${VER}_x86_64.rpm"
              if curl -sILf "$RPM_URL" >/dev/null 2>&1; then
                echo "Downloading and testing native RPM installation..."
                curl -fSL --retry 3 -o pkg.rpm "$RPM_URL"
                if dnf install -y ./pkg.rpm; then
                  which audion || test -f /usr/bin/audion
                  echo "RPM installed successfully on ${{ matrix.name }}"
                else
                  echo "::warning::RPM installation failed on ${{ matrix.name }} (non-fatal in initial rollout)"
                fi
                rm -f pkg.rpm
              fi
              ;;
            zypper)
              RPM_URL="${BASE}/audion_${VER}_x86_64.rpm"
              if curl -sILf "$RPM_URL" >/dev/null 2>&1; then
                echo "Downloading and testing native RPM installation on openSUSE..."
                curl -fSL --retry 3 -o pkg.rpm "$RPM_URL"
                if zypper --non-interactive install ./pkg.rpm; then
                  which audion || test -f /usr/bin/audion
                  echo "RPM installed successfully on ${{ matrix.name }}"
                else
                  echo "::warning::RPM installation failed on ${{ matrix.name }} (non-fatal in initial rollout)"
                fi
                rm -f pkg.rpm
              fi
              ;;
          esac

      - name: Check the release asset is the patched AppImage
        run: |
          set -e
          # The patched AppImage has a bash wrapper as AppRun. The unpatched Tauri
          # build has a symlink to the binary and fails with the WebKit ENOENT crash.
          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 ./audion.AppImage --appimage-extract AppRun > /dev/null
          if [ "$(head -c 2 squashfs-root/AppRun 2>/dev/null)" != "#!" ]; then
            echo "::error::AppRun is not the wrapper script - the unpatched AppImage was released"
            exit 1
          fi
          rm -rf squashfs-root

      - name: Launch, verify window renders, verify it stays alive
        id: launch
        env:
          APP_BIN_NAME: audion
          WINDOW_TIMEOUT: "60"
          STABLE_SECS: "15"
          MIN_COLORS: "16"
        run: |
          set +e
          mkdir -p result

          cat > /tmp/smoke.sh <<'EOF'
          #!/usr/bin/env bash
          # Runs inside xvfb-run.
          set -u

          BIN_NAME="${APP_BIN_NAME:-audion}"
          WINDOW_TIMEOUT="${WINDOW_TIMEOUT:-60}"
          STABLE_SECS="${STABLE_SECS:-15}"
          MIN_COLORS="${MIN_COLORS:-16}"
          LOG="$OUT/launch.log"
          mkdir -p "$OUT"
          : > "$LOG"

          # ImageMagick 6 ships "import"/"identify"; IM7-only systems use "magick <tool>".
          if command -v import >/dev/null 2>&1; then
            shot()   { import -window root "$1"; }
            colors() { identify -format '%k' "$1"; }
          else
            shot()   { magick import -window root "$1"; }
            colors() { magick identify -format '%k' "$1"; }
          fi

          fail() {
            echo "$1" > "$OUT/reason.txt"
            echo "::error::$1"
            shot "$OUT/screenshot.png" 2>/dev/null || true
            pkill -x "$BIN_NAME" 2>/dev/null || true
            exit 1
          }

          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export LANG=C.UTF-8
          export APPIMAGE_EXTRACT_AND_RUN=1   # no FUSE inside containers

          # Under headless Xvfb container test environments without hardware DRI,
          # guarantee pure software rasterization and headless-safe WebKit settings.
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

          # Launch from an unrelated cwd on purpose: WebKit resolves its helper
          # process path relative to the cwd, which was the original crash.
          cd /tmp
          if command -v dbus-run-session >/dev/null 2>&1; then
            dbus-run-session -- "$APPIMAGE_PATH" >"$LOG" 2>&1 &
          else
            "$APPIMAGE_PATH" >"$LOG" 2>&1 &
          fi
          LAUNCH_PID=$!

          SEEN=0; WINDOW=0; RENDERED=0; N=0
          START=$SECONDS
          while [ $((SECONDS - START)) -lt "$WINDOW_TIMEOUT" ]; do
            sleep 1
            PID=$(pgrep -xo "$BIN_NAME" || true)

            if [ -z "$PID" ]; then
              if [ "$SEEN" = 1 ]; then
                fail "App process exited $((SECONDS - START))s after launch (crash)"
              fi
              if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then
                fail "Launcher exited before the app process ever started"
              fi
              continue
            fi
            SEEN=1

            if [ -n "$(xdotool search --onlyvisible --pid "$PID" 2>/dev/null)" ]; then
              WINDOW=1
              shot "$OUT/screenshot.png" 2>/dev/null || continue
              N=$(colors "$OUT/screenshot.png" 2>/dev/null || echo 0)
              if [ "${N:-0}" -ge "$MIN_COLORS" ]; then
                RENDERED=1
                break
              fi
            fi
          done

          [ "$SEEN" = 1 ]     || fail "App process never started within ${WINDOW_TIMEOUT}s"
          [ "$WINDOW" = 1 ]   || fail "App is running but no visible window appeared within ${WINDOW_TIMEOUT}s"
          [ "$RENDERED" = 1 ] || fail "Window stayed blank/black: only ${N} distinct colors on screen after ${WINDOW_TIMEOUT}s"

          # Rendered once. Now make sure it does not crash a moment later
          # (the original bug was a window that flashed and then died).
          for _ in $(seq 1 "$STABLE_SECS"); do
            sleep 1
            pgrep -x "$BIN_NAME" >/dev/null || fail "App crashed after first render (within ${STABLE_SECS}s)"
          done

          shot "$OUT/screenshot.png" 2>/dev/null || true
          N=$(colors "$OUT/screenshot.png" 2>/dev/null || echo 0)
          [ "${N:-0}" -ge "$MIN_COLORS" ] || fail "Window went blank after rendering (${N} colors)"

          # Hard-fail log patterns (these mean the webview cannot work)
          HARD='Unable to spawn a new child process|Failed to spawn child process|Segmentation fault|core dumped|Received invalid message'
          if grep -Eiq "$HARD" "$LOG"; then
            fail "Fatal error in log: $(grep -Eim1 "$HARD" "$LOG" | cut -c1-200)"
          fi
          # Soft patterns: surface as warnings, do not fail
          SOFT='undefined symbol|cannot open shared object|panicked at'
          if grep -Eiq "$SOFT" "$LOG"; then
            echo "::warning::Suspicious log line: $(grep -Eim1 "$SOFT" "$LOG" | cut -c1-200)"
          fi

          pkill -x "$BIN_NAME" 2>/dev/null || true
          kill "$LAUNCH_PID" 2>/dev/null || true
          echo "Rendered (${N} colors) and stayed alive ${STABLE_SECS}s after first paint" > "$OUT/reason.txt"
          echo "OK: $(cat "$OUT/reason.txt")"
          exit 0
          EOF

          export APPIMAGE_PATH="$PWD/audion.AppImage"
          export OUT="$PWD/result"
          xvfb-run -a --server-args="-screen 0 1280x800x24 -ac +extension GLX +render -noreset" \
            bash /tmp/smoke.sh
          RC=$?

          echo "----- launch.log (${{ matrix.name }}) -----"
          cat result/launch.log || true
          echo "---------------------------------------"

          if [ $RC -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          exit $RC

      - name: Write result metadata (always runs, even on failure)
        if: always()
        env:
          STATUS: ${{ steps.launch.outputs.status }}
        run: |
          mkdir -p result
          if [ -z "$STATUS" ]; then STATUS="fail"; fi
          if [ ! -f result/launch.log ]; then
            echo "No launch.log produced - failed during dependency install, download or asset check, before the app launched." > result/launch.log
          fi
          if [ ! -f result/reason.txt ]; then
            echo "Failed before launch (deps, download or asset check)" > result/reason.txt
          fi
          {
            echo "distro=${{ matrix.name }}"
            echo "image=${{ matrix.image }}"
            echo "status=$STATUS"
            echo "reason=$(tr '\n' ' ' < result/reason.txt | cut -c1-300)"
          } > result/meta.txt

      - name: Upload result artifact (log + screenshot, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: result/
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: smoke-test-linux
    if: always()
    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: result-*
          path: results
          merge-multiple: false

      - name: Build summary table with full logs
        id: build
        env:
          TAG: ${{ inputs.tag_name }}
          NEEDS_RESULT: ${{ needs.smoke-test-linux.result }}
        run: |
          {
            echo "## Linux smoke test - $TAG"
            echo ""
            echo "| Distro | Image | Result | Detail |"
            echo "|---|---|---|---|"
          } > table.md

          OVERALL="success"
          COUNT=0

          for dir in results/*/; do
            META="${dir}meta.txt"
            if [ ! -f "$META" ]; then continue; fi
            COUNT=$((COUNT + 1))
            DISTRO=$(grep '^distro=' "$META" | cut -d= -f2-)
            IMAGE=$(grep '^image=' "$META" | cut -d= -f2-)
            STATUS=$(grep '^status=' "$META" | cut -d= -f2-)
            REASON=$(grep '^reason=' "$META" | cut -d= -f2-)
            REASON="${REASON//|/\\|}"

            if [ "$STATUS" = "pass" ]; then
              echo "| $DISTRO | \`$IMAGE\` | ✅ Pass | $REASON |" >> table.md
            else
              echo "| $DISTRO | \`$IMAGE\` | ❌ Fail | $REASON |" >> table.md
              OVERALL="failure"
            fi
          done

          # A job that died before uploading its artifact must not look like success.
          if [ "$COUNT" -eq 0 ] || [ "$NEEDS_RESULT" != "success" ]; then
            OVERALL="failure"
          fi

          echo "" >> table.md
          echo "### Launch logs per distro" >> table.md
          echo "Screenshots are in the \`result-<distro>\` artifacts of this run." >> table.md
          echo "" >> table.md

          for dir in results/*/; do
            META="${dir}meta.txt"
            LOG="${dir}launch.log"
            if [ ! -f "$META" ]; then continue; fi
            DISTRO=$(grep '^distro=' "$META" | cut -d= -f2-)
            STATUS=$(grep '^status=' "$META" | cut -d= -f2-)
            ICON="✅"
            if [ "$STATUS" != "pass" ]; then ICON="❌"; fi

            {
              echo "<details><summary>$ICON $DISTRO</summary>"
              echo ""
              echo '```'
              if [ -f "$LOG" ]; then tail -c 6000 "$LOG"; else echo "(no log captured)"; fi
              echo '```'
              echo "</details>"
              echo ""
            } >> table.md
          done

          cat table.md >> "$GITHUB_STEP_SUMMARY"
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"

      - name: Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OVERALL: ${{ steps.build.outputs.overall }}
          TAG: ${{ inputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          if [ "$OVERALL" = "success" ]; then
            TITLE="✅ Verified $TAG - all distros passed"
            COLOR=3066993
          else
            TITLE="🚨 Verify failed for $TAG - see job summary for logs"
            COLOR=15158332
          fi

          DESC=""
          for dir in results/*/; do
            META="${dir}meta.txt"
            if [ ! -f "$META" ]; then continue; fi
            DISTRO=$(grep '^distro=' "$META" | cut -d= -f2-)
            STATUS=$(grep '^status=' "$META" | cut -d= -f2-)
            REASON=$(grep '^reason=' "$META" | cut -d= -f2- | cut -c1-120)
            if [ "$STATUS" = "pass" ]; then
              DESC="${DESC}✅ ${DISTRO}"$'\n'
            else
              DESC="${DESC}❌ ${DISTRO}: ${REASON}"$'\n'
            fi
          done

          # jq builds valid JSON even if a failure reason contains quotes
          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "https://github.com/$REPO/releases/tag/$TAG" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color}]}' \
          | curl -sS -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK_URL"

      - name: Fail the workflow if any distro failed
        env:
          OVERALL: ${{ steps.build.outputs.overall }}
        run: |
          if [ "$OVERALL" != "success" ]; then
            echo "::error::One or more distros failed the smoke test - see summary above."
            exit 1
          fi