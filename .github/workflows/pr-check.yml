# PR Checks — Catch platform-specific build failures BEFORE merge
name: PR Checks
on:
  pull_request:
    branches: [master]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  # ---------------------------------------------------------------------------
  # Linux compilation & type check — catches Rust type errors, target-specific
  # integration regressions, and Svelte frontend breakages BEFORE merge
  # ---------------------------------------------------------------------------
  linux-pr-check:
    name: Linux Build & Type Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node, Rust, cache, and Linux deps
        uses: ./.github/actions/setup
        with:
          platform: linux

      - name: Frontend Check (Svelte & TypeScript)
        run: npm run check

      - name: Cargo Check for Linux Target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Verify Tests Compile (no-run)
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu --no-run

  # ---------------------------------------------------------------------------
  # Android Kotlin compilation — catches type errors, name shadowing, and
  # Gradle config issues without needing a full Android build
  # ---------------------------------------------------------------------------
  android-kotlin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (npm)
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: aarch64-linux-android
      - name: Fetch Rust dependencies (needed for Android library sources)
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Cache tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri
          key: tauri-cli-2.11.0

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Install Android SDK Platform 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Verify MainActivity.kt exists
        run: test -f src-tauri/gen/android/app/src/main/java/com/audion/app/MainActivity.kt
      - name: Dummy key.properties (no real keystore needed for a Kotlin-only compile check)
        run: |
          cat > src-tauri/gen/android/key.properties << 'EOF'
          keyAlias=dummy
          keyPassword=dummy
          storeFile=dummy.jks
          storePassword=dummy
          EOF
      - name: Generate Android build files (writes tauri.settings.gradle, needed by settings.gradle)
        run: cargo tauri android build --debug --target aarch64 --ci
        continue-on-error: true
      - name: Verify tauri.settings.gradle was generated
        run: test -f src-tauri/gen/android/tauri.settings.gradle
      - name: Compile Kotlin (debug)
        run: |
          cd src-tauri/gen/android
          chmod +x ./gradlew
          ./gradlew compileDebugKotlin --no-daemon
