name: Release
on:
  push:
    branches:
      - master
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (main, beta, hotfix)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - beta
          - hotfix
      tag_name:
        description: 'Tag name to update (required for hotfix, e.g., v1.2.3)'
        required: false
        type: string
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      build_flatpak:
        description: 'Build Flatpak'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean
      build_android:
        description: 'Build Android'
        required: false
        default: true
        type: boolean
      overwrite:
        description: 'Overwrite existing assets (only for hotfix)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create GitHub Release (pre-creates tag + release so parallel jobs never race)
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          name: ${{ steps.info.outputs.tag_name }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Windows Build
  # ---------------------------------------------------------------------------
  release-windows:
    runs-on: windows-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_windows == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Build Tauri app
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt of $maxAttempts"
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) {
              Write-Host "::error::Tauri build failed after $maxAttempts attempts"
              exit $LASTEXITCODE
            }
            Write-Host "Build failed (likely a transient WiX3 download issue), clearing WiX cache and retrying in 15s..."
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\tauri\WixTools314" -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload compiled exe for MSIX packaging job
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/audion.exe
          retention-days: 1

      - name: Rename artifacts
        shell: pwsh
        run: |
          $ver = "${{ needs.create-release.outputs.version }}"
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Rename-Item -NewName "audion_${ver}_windows.msi"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Rename-Item -NewName "audion_${ver}_windows.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig | Rename-Item -NewName "audion_${ver}_windows.exe.sig"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/msi/audion_*_windows.msi
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { return }
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG_NAME"
          $payload = @{
            embeds = @(
              @{
                title = "🪟 Windows Build Ready ($env:TAG_NAME)"
                description = "Windows installer (.exe) and MSI package build completed."
                color = 0x0078D4
                url = $releaseUrl
                footer = @{ text = "Audion Build System" }
              }
            )
            components = @(
              @{
                type = 1
                components = @(
                  @{
                    type = 2
                    style = 5
                    label = "View Release"
                    url = $releaseUrl
                    emoji = @{ name = "📦" }
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json"

  # ---------------------------------------------------------------------------
  # Windows MSIX Build
  # ---------------------------------------------------------------------------
  release-windows-msix:
    runs-on: windows-latest
    needs: [create-release, release-windows]
    if: needs.release-windows.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Download compiled exe from build job
        uses: actions/download-artifact@v6
        with:
          name: windows-exe
          path: src-tauri/target/release

      - name: Decode MSIX signing cert
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("audion-msix.pfx", $bytes)

      - name: Build MSIX bundle (sideload, self-signed)
        run: npm run tauri:windows:build -- --runner npm
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}

      - name: Rename MSIX artifact
        shell: pwsh
        run: |
          $ver = "${{ needs.create-release.outputs.version }}"
          Get-ChildItem src-tauri/target/msix/*.msix | Rename-Item -NewName "audion_${ver}_windows.msix"

      - name: Clean up cert from workspace
        if: always()
        shell: pwsh
        run: Remove-Item -Path audion-msix.pfx -ErrorAction SilentlyContinue

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/msix/audion_*_windows.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { return }
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:TAG_NAME"
          $payload = @{
            embeds = @(
              @{
                title = "📦 Windows MSIX Package Ready ($env:TAG_NAME)"
                description = "Windows MSIX package build completed."
                color = 0x0078D4
                url = $releaseUrl
                footer = @{ text = "Audion Build System" }
              }
            )
            components = @(
              @{
                type = 1
                components = @(
                  @{
                    type = 2
                    style = 5
                    label = "View Release"
                    url = $releaseUrl
                    emoji = @{ name = "📦" }
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json"


# ---------------------------------------------------------------------------
# Linux Build — Universal AppImage (GPU-safe, Bazzite/immutable distro compat)
# ---------------------------------------------------------------------------
  release-linux:
    runs-on: ubuntu-22.04        # ← 22.04, NOT 24.04 (older glibc = broader compat)
    timeout-minutes: 60          # prevent 6-hour hang on stuck xvfb/webkit
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_linux == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: linux

      - name: Build Tauri app
        run: |
          xvfb-run -a \
            --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Patch AppImage with GPU-safe wrapper script
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*-patched*" | head -1)
          if [ -z "$APPIMAGE" ]; then echo "No AppImage found"; exit 1; fi
          echo "Patching: $APPIMAGE"

          # Extract AppImage — APPIMAGE_EXTRACT_AND_RUN=1 avoids libfuse2 requirement on
          # ubuntu-22.04 runners which do not have libfuse2 installed by default.
          # Pre-clean squashfs-root in case of a step retry leaving a stale dir.
          rm -rf squashfs-root
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract

          # ---------------------------------------------------------------------------
          # GPU / WebKit environment auto-detection
          # Bazzite and other immutable distros may have Wayland-only or broken EGL.
          # ---------------------------------------------------------------------------

          # Back up original AppRun and replace
          if [ -L squashfs-root/AppRun ]; then
            rm squashfs-root/AppRun          # symlink — just remove, binary is elsewhere
          else
            mv squashfs-root/AppRun squashfs-root/AppRun-original
          fi

          # Copy pre-committed wrapper scripts — shebang at col 0 guaranteed.
          # Scripts live in .github/scripts/ to avoid heredoc-indentation bugs
          # (YAML run: | preserves indent; bash heredoc shebang would land at col 10
          # and the kernel would reject the script with "exec format error").
          cp .github/scripts/appimage-apprun-real.sh squashfs-root/AppRun-real
          cp .github/scripts/appimage-apprun.sh squashfs-root/AppRun
          chmod +x squashfs-root/AppRun-real squashfs-root/AppRun

          # WebKit computes subprocess path as: dirname(binary)/../../lib/...
          # (binary is usr/bin/audion, so two levels up = root, then lib/).
          # The Tauri AppImage bundler does not create a root-level lib symlink,
          # so WebKitNetworkProcess fails with ENOENT. Add the symlink.
          ln -sf usr/lib squashfs-root/lib

          # make it a relative link to the bundled top-level icon.
          ICON_FILE=$(find squashfs-root -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.svg" \) | head -1)
          if [ -z "$ICON_FILE" ]; then echo "::error::No top-level icon found in AppDir"; exit 1; fi
          rm -f squashfs-root/.DirIcon
          ln -s "$(basename "$ICON_FILE")" squashfs-root/.DirIcon
          test -e squashfs-root/.DirIcon || { echo "::error::.DirIcon still dangling"; exit 1; }

          # normalize permissions: --appimage-extract leaves directories at 0700 (and some files at 0770)
          chmod -R u+rwX,go+rX,go-w squashfs-root
          chmod 755 squashfs-root/AppRun squashfs-root/AppRun-real
          [ -f squashfs-root/AppRun-original ] && chmod 755 squashfs-root/AppRun-original
          [ -f squashfs-root/AppRun.wrapped ] && chmod 755 squashfs-root/AppRun.wrapped
          find squashfs-root -type d ! -perm -o+rx -o -type f ! -perm -o+r | grep . && { echo "::error::unreadable paths remain"; exit 1; } || true

          # Repack the AppImage
          # NOTE: appimagetool is itself an AppImage. GitHub Actions runners do not
          # have libfuse.so.2 (FUSE 2). Setting APPIMAGE_EXTRACT_AND_RUN=1 makes the
          # AppImage runtime self-extract to a tmpdir and exec without FUSE.
          # AppImageKit release/13 assets were renamed to "obsolete-*" and the old URL is dead.
          # The project moved to github.com/AppImage/appimagetool (continuous is the only release).
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool --no-appstream squashfs-root \
            "src-tauri/target/release/bundle/appimage/audion-patched.AppImage"

          if [ ! -f "src-tauri/target/release/bundle/appimage/audion-patched.AppImage" ]; then
            echo "::error::appimagetool did not produce audion-patched.AppImage"
            exit 1
          fi
          echo "Repacked AppImage size: $(du -sh src-tauri/target/release/bundle/appimage/audion-patched.AppImage)"

          # Clean up extracted dir
          rm -rf squashfs-root

      - name: Rename and repackage artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VER="${{ needs.create-release.outputs.version }}"
          BUNDLE="src-tauri/target/release/bundle"

          # Rename DEB
          DEB_FILE=$(find "${BUNDLE}/deb" -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "${BUNDLE}/deb/audion_${VER}_linux.deb"
          fi

          # Rename patched AppImage
          mv "${BUNDLE}/appimage/audion-patched.AppImage" \
             "${BUNDLE}/appimage/audion_${VER}_x86_64.AppImage"

          # Re-tar and re-sign from the patched AppImage.
          # createUpdaterArtifacts produced a .tar.gz during build but wrapped
          # the unpatched binary — discard it and regenerate from the patched one.
          rm -f "${BUNDLE}"/appimage/*.AppImage.tar.gz \
                "${BUNDLE}"/appimage/*.AppImage.tar.gz.sig
          tar -czf "${BUNDLE}/appimage/audion_${VER}_x86_64.AppImage.tar.gz" \
            -C "${BUNDLE}/appimage" "audion_${VER}_x86_64.AppImage"
          npm run tauri -- signer sign \
            "${BUNDLE}/appimage/audion_${VER}_x86_64.AppImage.tar.gz" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/deb/audion_*_linux.deb
            src-tauri/target/release/bundle/appimage/audion_*_x86_64.AppImage
            src-tauri/target/release/bundle/appimage/audion_*_x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/audion_*_x86_64.AppImage.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          PAYLOAD=$(jq -n \
            --arg title "🐧 Linux Build Ready (${TAG_NAME})" \
            --arg desc "Universal AppImage & DEB packages uploaded to GitHub Releases." \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 16565796,
                url: $url,
                footer: { text: "Audion Build System" }
              }],
              components: [{
                type: 1,
                components: [{
                  type: 2,
                  style: 5,
                  label: "View Release",
                  url: $url,
                  emoji: { name: "📦" }
                }]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Linux Smoke Test — verify AppImage launches on popular distros
  #
  # Runs headlessly via xvfb on 3 targets:
  #   ubuntu-22.04  → Ubuntu 22 LTS (glibc 2.35, build runner baseline)
  #   ubuntu-24.04  → Ubuntu 24 LTS (glibc 2.39, newest Ubuntu LTS)
  #   fedora-40     → Fedora 40 container (glibc 2.39, Mesa 24, SELinux off)
  #
  # The test downloads the published AppImage, runs it headlessly for up to
  # 20s, then checks the exit code is not a crash signal (SIGSEGV=139,
  # SIGABRT=134, SIGILL=132, SIGBUS=138). A clean timeout (exit 0 or 124)
  # means the app launched and ran without crashing — that's the signal we care
  # about. A non-zero exit from the app itself is also accepted (e.g. it may
  # exit 1 when there is no audio device), as long as it is not a signal kill.
  # ---------------------------------------------------------------------------
  test-linux-smoke:
    name: Smoke test AppImage (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: [create-release, release-linux]
    if: needs.release-linux.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04
            runner: ubuntu-22.04
            use_docker: false
            docker_image: ""
            alsa_pkg: libasound2
          - label: ubuntu-24.04
            runner: ubuntu-24.04
            use_docker: false
            docker_image: ""
            alsa_pkg: libasound2t64
          - label: fedora-40
            runner: ubuntu-24.04
            use_docker: true
            docker_image: "fedora:40"
            alsa_pkg: ""
    steps:
      - name: Install runtime deps (Ubuntu runner)
        if: matrix.use_docker == false
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libappindicator3-1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxrender1 \
            libxfixes3 \
            ${{ matrix.alsa_pkg }} \
            xvfb \
            fuse

      - name: Download AppImage from release (Ubuntu runner)
        if: matrix.use_docker == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            -L "https://github.com/${{ github.repository }}/releases/download/${TAG}/audion_${VER}_x86_64.AppImage" \
            -o audion.AppImage
          chmod +x audion.AppImage

      - name: Smoke test — Ubuntu runner
        if: matrix.use_docker == false
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_FORCE_SANDBOX=0
          export GIO_USE_VFS=local
          export GIO_MODULE_DIR=/dev/null
          export GTK_IM_MODULE=simple
          export AUDION_DISABLE_DRI3=1

          # Capture the app's real exit status
          mkdir -p smoke-out
          set +e
          xvfb-run -a --server-args="-screen 0 1280x720x24 -ac" \
            timeout 20s ./audion.AppImage > smoke-out/smoke.log 2>&1
          EXIT=$?
          set -e
          echo "$EXIT" > smoke-out/exit-code.txt
          head -100 smoke-out/smoke.log

          echo "Exit code: $EXIT"
          case $EXIT in
            0|124)  echo "✅ Launched cleanly (exit=$EXIT)" ;;
            132|134|135|136|139) echo "❌ Crashed with signal (exit=$EXIT)"; exit 1 ;;
            *) echo "⚠️  Exited $EXIT (non-signal — treated as pass)" ;;
          esac

      - name: Download AppImage from release (Fedora 40)
        if: matrix.use_docker == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          curl -fsSL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            -L "https://github.com/${{ github.repository }}/releases/download/${TAG}/audion_${VER}_x86_64.AppImage" \
            -o audion.AppImage
          chmod +x audion.AppImage

      # dnf needs to reach Fedora's mirrors, so this has to run in its own container with network access
      # it can't share a 'docker run' with the actual smoke test below,
      # which intentionally has --network=none
      - name: Prepare Fedora 40 image with runtime deps
        if: matrix.use_docker == true
        run: |
          docker run --name audion-smoke-base ${{ matrix.docker_image }} bash -c '
            dnf install -y --quiet \
              webkit2gtk4.1 gtk3 libappindicator-gtk3 glib2 dbus-libs \
              libX11 libXcomposite libXdamage libXrandr libXrender libXfixes \
              alsa-lib xorg-x11-server-Xvfb
          '
          docker commit audion-smoke-base audion-smoke-fedora40
          docker rm audion-smoke-base

      # Run the smoke test inside the prepared Fedora 40 image
      # --privileged: needed for FUSE (APPIMAGE_EXTRACT_AND_RUN bypasses this,
      # but xvfb-run needs /dev/shm write access).
      # --network=none: no outbound traffic from the app during the test.
      - name: Smoke test — Fedora 40 (Docker)
        if: matrix.use_docker == true
        run: |
          mkdir -p smoke-out
          docker run --rm \
            --privileged \
            --network=none \
            -v "$PWD/audion.AppImage:/audion.AppImage" \
            -v "$PWD/smoke-out:/out" \
            audion-smoke-fedora40 \
            bash -c '
              export APPIMAGE_EXTRACT_AND_RUN=1
              export WEBKIT_DISABLE_DMABUF_RENDERER=1
              export WEBKIT_DISABLE_COMPOSITING_MODE=1
              export WEBKIT_FORCE_SANDBOX=0
              export GIO_USE_VFS=local
              export GIO_MODULE_DIR=/dev/null
              export GTK_IM_MODULE=simple
              export AUDION_DISABLE_DRI3=1

              set +e
              Xvfb :99 -screen 0 1280x720x24 -ac &
              sleep 1
              DISPLAY=:99 timeout 20s /audion.AppImage > /out/smoke.log 2>&1
              EXIT=$?
              echo "$EXIT" > /out/exit-code.txt
              head -100 /out/smoke.log

              echo "Exit code: $EXIT"
              case $EXIT in
                0|124)  echo "✅ Launched cleanly (exit=$EXIT)" ;;
                132|134|135|136|139) echo "❌ Crashed with signal (exit=$EXIT)"; exit 1 ;;
                *) echo "⚠️  Exited $EXIT (non-signal — treated as pass)" ;;
              esac
            '

      # Runs even when the smoke test step fails, so a crash still leaves its full log behind
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.label }}
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Flatpak Build
  # ---------------------------------------------------------------------------
  release-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      # gnome-48 was never published on ghcr.io/flathub-infra; gnome-49+ required.
      # gnome-47+ all ship WebKitGTK 4.1 (required for Tauri v2).
      options: --privileged
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_flatpak == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Flathub remote (system scope)
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --system

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.audion.app.yml
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          bundle: audion_${{ needs.create-release.outputs.version }}_flatpak.flatpak
          cache-key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/flatpak/*.yml') }}-v1
          upload-artifact: false
          verbose: true

      - name: Verify Flatpak bundle
        run: |
          ls -la
          ls -la *.flatpak || true
          test -f "audion_${{ needs.create-release.outputs.version }}_flatpak.flatpak"

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: audion_${{ needs.create-release.outputs.version }}_flatpak.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          PAYLOAD=$(jq -n \
            --arg title "📦 Flatpak Package Ready (${TAG_NAME})" \
            --arg desc "Flatpak bundle build completed." \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 4886754,
                url: $url,
                footer: { text: "Audion Build System" }
              }],
              components: [{
                type: 1,
                components: [{
                  type: 2,
                  style: 5,
                  label: "View Release",
                  url: $url,
                  emoji: { name: "📦" }
                }]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # macOS Build
  # ---------------------------------------------------------------------------
  release-macos:
    runs-on: macos-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_macos == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: macos
          rust_targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Tauri app (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          echo "--- dmg dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/ || true
          echo "--- macos dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/macos/ || true
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_${VER}_macos.dmg
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz.sig

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_*_macos.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          PAYLOAD=$(jq -n \
            --arg title "🍎 macOS Universal Build Ready (${TAG_NAME})" \
            --arg desc "macOS Universal DMG & App bundle uploaded to GitHub Releases." \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 0,
                url: $url,
                footer: { text: "Audion Build System" }
              }],
              components: [{
                type: 1,
                components: [{
                  type: 2,
                  style: 5,
                  label: "View Release",
                  url: $url,
                  emoji: { name: "📦" }
                }]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Updater Manifest (latest.json) — one job per platform, each merges its own
  # entry into the shared manifest under a concurrency lock. no job waits on
  # the others to build; they only queue briefly to take turns writing
  # ---------------------------------------------------------------------------
  update-manifest-windows:
    runs-on: ubuntu-latest
    needs: [create-release, release-windows]
    if: needs.release-windows.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_windows.exe.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: windows-x86_64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_windows.exe.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_windows.exe
          github_token: ${{ secrets.GITHUB_TOKEN }}

  update-manifest-macos:
    runs-on: ubuntu-latest
    needs: [create-release, release-macos]
    if: needs.release-macos.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_macos.app.tar.gz.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: darwin-x86_64,darwin-aarch64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_macos.app.tar.gz.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_macos.app.tar.gz
          github_token: ${{ secrets.GITHUB_TOKEN }}

  update-manifest-linux:
    runs-on: ubuntu-latest
    needs: [create-release, release-linux]
    if: needs.release-linux.result == 'success'
    concurrency:
      group: manifest-${{ needs.create-release.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .sig file from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_x86_64.AppImage.tar.gz.sig" --dir sigs --clobber

      - name: Merge into latest.json
        uses: ./.github/actions/update-manifest
        with:
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          platform_key: linux-x86_64
          sig_path: sigs/audion_${{ needs.create-release.outputs.version }}_x86_64.AppImage.tar.gz.sig
          artifact_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.tag_name }}/audion_${{ needs.create-release.outputs.version }}_x86_64.AppImage.tar.gz
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android Build
  # ---------------------------------------------------------------------------
  release-android:
    runs-on: ubuntu-latest
    needs: create-release
    if: |
      github.event_name == 'push' || inputs.build_android == true
    env:
      GRADLE_OPTS: -Xmx4096m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Setup Node and Rust (composite action)
        uses: ./.github/actions/setup
        with:
          platform: android
          rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri
          key: tauri-cli-2.11.0

      - name: Install tauri-cli (if not already)
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Setup Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > src-tauri/gen/android/key.properties

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Verify Android project initialized
        run: |
          test -f src-tauri/gen/android/app/src/main/java/com/audion/app/MainActivity.kt || {
            echo "::error::MainActivity.kt missing after init — tauri android init may have failed"
            exit 1
          }
          test -f src-tauri/gen/android/gradlew || {
            echo "::error::gradlew missing after init"
            exit 1
          }

      - name: Bundle libc++_shared.so into jniLibs
        run: |
          NDK_VERSION="29.0.14206865"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            echo "::error::NDK ${NDK_VERSION} not found at ${NDK_DIR}. Available NDKs:"
            ls -la "${ANDROID_HOME}/ndk/" || true
            exit 1
          fi
          # NDK r23+ moved libc++_shared.so out of sysroot/usr/lib/<abi>/
          # It now lives under toolchains/llvm/prebuilt/<host>/lib/ per target triple
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          JNI_DIR="src-tauri/gen/android/app/src/main/jniLibs"
          declare -A ABI_TRIPLE=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            TRIPLE="${ABI_TRIPLE[$ABI]}"
            SO=$(find "${TOOLCHAIN}" -name "libc++_shared.so" -path "*/${TRIPLE}/*" | head -1)
            if [ -z "$SO" ]; then
              echo "ERROR: libc++_shared.so not found for ${ABI} (triple: ${TRIPLE})"
              find "${TOOLCHAIN}" -name "libc++_shared.so" || true
              exit 1
            fi
            mkdir -p "${JNI_DIR}/${ABI}"
            cp "$SO" "${JNI_DIR}/${ABI}/"
            echo "Copied: $SO -> ${JNI_DIR}/${ABI}/"
          done

      - name: Build Tauri app for Android (Signed)
        run: npm run tauri android build

      - name: Verify libc++_shared.so is bundled
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Checking APK: $APK"
          echo "--- All .so files in APK ---"
          unzip -l "$APK" | grep "\.so" || echo "WARNING: No .so files found at all"
          echo "--- libc++ check ---"
          if unzip -l "$APK" | grep -q "libc++_shared.so"; then
            echo "OK: libc++_shared.so is bundled"
          else
            echo "ERROR: libc++_shared.so NOT FOUND in APK — app will crash at launch"
            exit 1
          fi

      - name: Rename Android artifacts
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          # Universal APK path (most common)
          UNIVERSAL_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ -f "$UNIVERSAL_APK" ]; then
            mv "$UNIVERSAL_APK" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
            echo "APK renamed to audion_${VER}_android.apk"
          else
            # Fallback: search for any APK in release directories
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
            if [ -n "$APK_FILE" ]; then
              mv "$APK_FILE" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
              echo "APK renamed to audion_${VER}_android.apk"
            else
              echo "No APK found"
              exit 1
            fi
          fi

      - name: Upload Android artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "audion_*_android.apk")
          TAG="${{ needs.create-release.outputs.tag_name }}"
          CLOBBER=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then CLOBBER="--clobber"; fi
          maxAttempts=3
          for attempt in $(seq 1 $maxAttempts); do
            echo "Upload attempt $attempt of $maxAttempts"
            if gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" $CLOBBER; then
              break
            fi
            if [ "$attempt" -eq "$maxAttempts" ]; then
              echo "::error::Upload to release failed after $maxAttempts attempts"
              exit 1
            fi
            echo "Upload failed (likely a transient GitHub API error), retrying in 15s..."
            sleep 15
          done

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          PAYLOAD=$(jq -n \
            --arg title "🤖 Android APK Ready (${TAG_NAME})" \
            --arg desc "Signed Android APK uploaded to GitHub Releases." \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 4054148,
                url: $url,
                footer: { text: "Audion Build System" }
              }],
              components: [{
                type: 1,
                components: [{
                  type: 2,
                  style: 5,
                  label: "View Release",
                  url: $url,
                  emoji: { name: "📦" }
                }]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Final Discord Release Announcement with Release Notes & Link Buttons
  # ---------------------------------------------------------------------------
  release-summary-discord:
    name: Discord Release Announcement
    runs-on: ubuntu-latest
    needs: [create-release, release-windows, release-linux, release-macos, release-android, release-flatpak]
    if: always() && needs.create-release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Send Discord Release Announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi

          # Extract release notes highlights from releasenote.md
          NOTES=""
          if [ -f releasenote.md ]; then
            NOTES=$(head -n 45 releasenote.md | grep -v '^## \[' | head -c 1800)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Audion $TAG_NAME release artifacts are now available for download across all platforms."
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/master/releasenote.md"

          PAYLOAD=$(jq -n \
            --arg title "🚀 Audion ${TAG_NAME} Released!" \
            --arg desc "$NOTES" \
            --arg rel_url "$RELEASE_URL" \
            --arg change_url "$CHANGELOG_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 1947988,
                url: $rel_url,
                fields: [
                  {
                    name: "📱 Platforms & Packages",
                    value: "🪟 Windows (.exe, .msi, .msix)\n🐧 Linux (.AppImage, .deb)\n📦 Flatpak (.flatpak)\n🍎 macOS (.dmg, .app.tar.gz)\n🤖 Android (.apk)",
                    inline: false
                  }
                ],
                footer: {
                  text: "Audion Release Pipeline"
                }
              }],
              components: [{
                type: 1,
                components: [
                  {
                    type: 2,
                    style: 5,
                    label: "Download Release",
                    url: $rel_url,
                    emoji: { name: "📦" }
                  },
                  {
                    type: 2,
                    style: 5,
                    label: "Full Release Notes",
                    url: $change_url,
                    emoji: { name: "📜" }
                  }
                ]
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"