app-id: com.audion.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

command: audion

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-music:rw
  - --filesystem=xdg-download:rw
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.audion
  # Deep-link / OAuth callback — tauri-plugin-deep-link needs XDG portal for URI open.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.OpenURI
  # WebKit sandbox: disable inner sandbox — Flatpak/bwrap is the outer sandbox.
  - --env=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
  # Skip dmabuf/DRI3 fast path — prevents blank screens on machines with broken EGL.
  # --device=dri above provides real GPU access when available; this var only skips
  # the dmabuf compositor, not hardware rendering entirely.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=GIO_USE_VFS=local
  - --unset-env=GTK_MODULES

build-options:
  build-args:
    - --share=network
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  prepend-path: /usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/audion/.cargo
    npm_config_cache: /run/build/audion/.npm
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib64/pkgconfig
    NPM_CONFIG_CACHE: /run/build/audion/.npm
    npm_config_loglevel: verbose

modules:
  - name: audion
    buildsystem: simple
    build-commands:
      - npm ci --verbose
      # tauri build embeds the frontend dist/ into the binary at compile time.
      # Plain `cargo build` skips this step — the binary launches with no UI.
      # Use tauri CLI so the full bundle pipeline runs (vite build + cargo).
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/audion /app/bin/audion
      - install -Dm644 packaging/flatpak/com.audion.app.desktop /app/share/applications/com.audion.app.desktop
      - install -Dm644 packaging/flatpak/com.audion.app.metainfo.xml /app/share/metainfo/com.audion.app.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.audion.app.png
    sources:
      - type: dir
        path: ../../
