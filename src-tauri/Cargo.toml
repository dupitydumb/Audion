[package]
name = "audion"
version = "1.3.9"
description = "A local Spotify-style music player"
authors = ["AvKov"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "audion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# =============================================================================
# FEATURE FLAGS
# =============================================================================
# native-audio: Force native audio backend (rodio) on all platforms.
#               Linux enables this automatically. Use this flag to enable
#               on Windows/macOS for testing or if you prefer native playback.
#
# Example: cargo build --features native-audio
# =============================================================================
[features]
default = []
native-audio = []

[build-dependencies]
tauri-build = { version = "~2.6.0", features = [] }

[dependencies]
tauri = { version = "~2.11.0", features = ["protocol-asset", "devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# dirs for cross-platform app data paths
dirs = "5"

# File scanning
walkdir = "2"

# Audio metadata extraction
lofty = "0.24.0"
ratio-metadata = "0.1"  # Add version as needed

# Metadata Writing
mp4ameta = "0.11"

# image background colors
color-thief = "0.2"
image = "0.25"

# SQLite database
rusqlite = { version = "0.31", features = ["bundled"] }

# Base64 encoding for album art
base64 = "0.22"

# compression
zip = { version = "8.6.0", default-features = false }

# HTTP client for API requests (rustls = pure-Rust TLS, no OpenSSL needed, works on Android)
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "rustls-tls", "gzip", "brotli", "multipart"] }
futures = "0.3"

# Error handling
thiserror = "1"
tokio = { version = "1.49.0", features = ["full"] }

# Deep link for OAuth callback (audion:// custom scheme)
tauri-plugin-deep-link = "2"

# UUID for device ID generation
uuid = { version = "1", features = ["v4"] }

# URL parsing for deep link handler
url = "2"


# Hash Compare
sha2 = "0.10"

# Parallel processing
rayon = "1.12" 

 # Thread-safe channels
crossbeam = "0.8"

# Move files to trash instead of permanent deletion (security, desktop only)
# trash is in [target.'cfg(desktop)'.dependencies]

# Logging for audit trail
log = "0.4"
env_logger = "0.11"
metaflac = "0.2.8"
tauri-plugin-window-state = "2.4.1"

# Logging and Tracing (Moved to general dependencies for Android support)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# =============================================================================
# NATIVE AUDIO BACKEND
# =============================================================================
# We use rodio to provide native audio playback that bypasses the WebView
# for better performance and reliability across all platforms.
# =============================================================================
rodio = { version = "0.22.2", default-features = false, features = [
    "vorbis",
    "symphonia-flac",
    "symphonia-mp3",
    "symphonia-wav",
    "symphonia-aac",
    "symphonia-isomp4",
    "symphonia-all",
    "crossbeam-channel",
    "playback",
    "tracing"
] }

symphonia = { version = "0.6", default-features = false, features = [
    # Containers
    "isomp4",   # MP4/M4A
    "ogg",      # OGG container
    "wav",      # WAV container
    "mkv",      # MKV/WebM
    "aiff",     # AIFF
    "caf",      # CAF (Apple Core Audio)

    # Codecs
    "aac",      # AAC-LC (for MP4/M4A)
    "mp3",      # MP3
    "mp1",      # MP1
    "mp2",      # MP2
    "flac",     # FLAC
    "alac",     # ALAC/Apple Lossless
    "pcm",      # PCM => required for WAV audio
    "vorbis",   # Vorbis => required for OGG audio
    "adpcm",    # ADPCM => used in some WAV files

    # Performance
    "opt-simd", # SIMD optimizations
] }

cpal = "0.17"
rubato = "3.0.0"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# Discord RPC (desktop only - uses local IPC sockets)
discord-rich-presence = "1.0"
# Move files to trash (desktop only)
trash = "5"
# Global keyboard shortcuts (desktop only)
tauri-plugin-global-shortcut = "2"
# Single instance to route deep links to existing window on Windows/Linux
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

souvlaki = "0.8"

# native os notifications(bypasses tauri-plugin-notification)
# preview-macos-un: opts into the modern backend on mac. default backend is deprecated
notify-rust = { version = "4", features = ["preview-macos-un"] }

# notify_rust's windows backend does not support hero image. calling winrt for that
[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common", 
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Security",
] }
raw-window-handle = "0.6"

[patch.crates-io]
lofty = { git = "https://github.com/SmileofHaven/lofty-rs", branch = "main" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"
